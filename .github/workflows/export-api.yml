name: Export API JSON (Weekly)

# Изпълнява се всяка събота в 02:17 UTC (05:17 Sofia/EEST).
# Защо толкова рано: сателитът (macro-satellite daily-collect, 04:00 UTC) чете
# output/api/macro_state.json от main — export-ът трябва да е committed ПРЕДИ това,
# за да влезе петъчният принт (напр. NFP, петък 12:30 UTC във FRED) в съботния
# state.json преди съботния ритуал (~07:30 UTC). Старият 07:00 крон комитваше
# 07:52-09:08 UTC — след билда на сателита (наблюдавани commit времена 07-08.2026).
# Нечетни минути: кръглите часове на GitHub scheduler-а чакат 1.5-3 ч опашка
# (прецедентът на cot-monitor, схема '23 6 * * 6').
# Може да се стартира и ръчно от GitHub UI: Actions → Export API JSON → Run workflow
on:
  schedule:
    - cron: '17 2 * * 6'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Force-refresh всички FRED серии (игнорира кеш)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  export-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (gate)
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Export API JSON
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.refresh }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python export_api.py --refresh --years 10
          else
            python export_api.py --years 10
          fi

      - name: Commit and push updated API files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/api/macro_state.json output/api/series_data.json
          git diff --cached --quiet || git commit -m "chore: update API JSON $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
