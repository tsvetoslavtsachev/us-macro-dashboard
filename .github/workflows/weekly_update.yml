name: Weekly US Macro Update

on:
  schedule:
    # Всеки понеделник в 06:00 UTC (08:00 Sofia зиме / 09:00 Sofia лете)
    # Symmetric с EU и China weekly_update workflow-ите
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Позволява ръчно стартиране от GitHub UI

# Public repo — НЕ commit-ваме briefing в git.
# Briefing-ът:
#   - Deploys на GitHub Pages: https://tsvetoslavtsachev.github.io/us-macro-dashboard/
#   - Запазен и като 90d build artifact (за historical download)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (gate)
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Compute cache key
        id: cache-key
        run: echo "key=us-macro-cache-$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            us-macro-cache-

      - name: Smart refresh stale series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py --refresh-only

      - name: Generate HTML briefing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # --with-analogs: Historical Analog Engine секция в deep-а (fetch на 11 ANALOG_*
        # серии 1976+; degrade-ва gracefully ако fetch се провали → секцията се пропуска).
        run: python run.py --briefing --with-analogs --no-browser

      - name: Generate Markdown context
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py --export-context --no-browser

      # ── AI-consumption слой (Фаза 4 / C3) ──────────────────────────────────
      - name: Export API JSON (macro_state + series_data)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python export_api.py --years 10

      - name: Assemble latest/ AI bundle (context.md + data.json + manifest.json)
        run: python export/build_latest.py

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          # index = latest quick (China-style scoreboard за 30-сек поглед)
          LATEST_QUICK=$(ls -1t output/briefing_quick_*.html 2>/dev/null | head -n1)
          if [ -n "$LATEST_QUICK" ]; then
            cp "$LATEST_QUICK" _site/index.html
          else
            # fallback ако quick не е генериран — index = latest deep
            cp $(ls -1t output/briefing_*.html | grep -v briefing_quick | head -n1) _site/index.html
          fi
          # копирай и двата вида briefings (deep + quick) за history
          cp output/briefing_*.html _site/ 2>/dev/null || true
          cp output/briefing_context_*.md _site/ 2>/dev/null || true
          # стабилен /latest/ AI-consumption слой (context.md + data.json + manifest.json + series.json)
          mkdir -p _site/latest _site/api
          cp output/latest/* _site/latest/ 2>/dev/null || true
          cp output/api/macro_state.json output/api/series_data.json _site/api/ 2>/dev/null || true
          ls -la _site/ _site/latest/

      - name: Upload briefing artifact (90d download)
        uses: actions/upload-artifact@v4
        with:
          name: briefing-us-${{ steps.cache-key.outputs.key }}
          path: |
            output/briefing_*.html
            output/briefing_context_*.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
